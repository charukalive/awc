<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWC Standalone Case Editor</title>
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs (Compat CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCqubiF5BLjNnol5HkcOdTcq156co4s27o",
      authDomain: "vfflk-a543e.firebaseapp.com",
      projectId: "vfflk-a543e",
      storageBucket: "vfflk-a543e.firebasestorage.app",
      messagingSenderId: "61010073715",
      appId: "1:61010073715:web:423ca808e5a56e0f3a3206"
    };

    let db = null;
    try {
      if (typeof firebase !== 'undefined') {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
      }
    } catch (e) {
      console.warn("Firebase initialization notice in Editor:", e);
    }

    const STAGES = [
      { key: 'RECEIVED', label: '1. Received' },
      { key: 'UNDER_REVIEW', label: '2. Under Review' },
      { key: 'ACTION_PLANNED', label: '3. Action Planned' },
      { key: 'ESCALATED', label: '4. Court / Escalated' },
      { key: 'RESOLVED', label: '5. Resolved' }
    ];

    const ADMIN_EMAIL = 'awcsrilanka@gmail.com';

    function EditorApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('awc_admin_auth') === 'true' && sessionStorage.getItem('awc_admin_email') === ADMIN_EMAIL;
      });
      const [loginEmail, setLoginEmail] = useState(ADMIN_EMAIL);
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [recordId, setRecordId] = useState('');
      const [isDirty, setIsDirty] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [saveToast, setSaveToast] = useState(null);

      // Record state
      const [ticket, setTicket] = useState(null);
      const [status, setStatus] = useState('RECEIVED');
      const [policeStation, setPoliceStation] = useState('');
      const [cibNumber, setCibNumber] = useState('');
      const [bReportNo, setBReportNo] = useState('');
      const [assignedLawyer, setAssignedLawyer] = useState('');
      const [internalNotes, setInternalNotes] = useState('');
      const [selectedStatutes, setSelectedStatutes] = useState([]);
      const [publishToPublic, setPublishToPublic] = useState(false);
      const [publicSummary, setPublicSummary] = useState('');
      const [assignedCaseId, setAssignedCaseId] = useState('');

      // Available Master Cases for assignment
      const [availableCases, setAvailableCases] = useState([]);
      const [linkedTickets, setLinkedTickets] = useState([]);

      // Read recordId from URL query param
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) {
          setRecordId(id);
          loadRecord(id);
        }

        // Load all available cases and tickets from localStorage
        const storedCases = JSON.parse(localStorage.getItem('awc_cases') || '[]');
        setAvailableCases(storedCases);

        const storedTickets = JSON.parse(localStorage.getItem('awc_tickets') || '[]');
        if (id && id.startsWith('CASE-')) {
          setLinkedTickets(storedTickets.filter(t => t.assignedCaseId === id));
        }
      }, []);

      // Unsaved Changes BeforeUnload Safeguard
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (isDirty) {
            e.preventDefault();
            e.returnValue = '';
          }
        };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [isDirty]);

      const populateTicketFields = (found) => {
        setTicket(found);
        setStatus(found.status || 'RECEIVED');
        setPoliceStation(found.policeStation || '');
        setCibNumber(found.cibNumber || '');
        setBReportNo(found.bReportNo || '');
        setAssignedLawyer(found.assignedLawyer || '');
        setInternalNotes(found.internalNotes || '');
        setSelectedStatutes(found.selectedStatutes || ['1907_SEC_2']);
        setPublishToPublic(found.publishToPublic || false);
        setPublicSummary(found.publicSummary || '');
        setAssignedCaseId(found.assignedCaseId || '');
      };

      const fallbackLoad = (id) => {
        const tickets = JSON.parse(localStorage.getItem('awc_tickets') || '[]');
        const found = tickets.find(t => t.token === id);
        if (found) {
          populateTicketFields(found);
        } else {
          const cases = JSON.parse(localStorage.getItem('awc_cases') || '[]');
          const foundCase = cases.find(c => c.id === id);
          if (foundCase) {
            setTicket({
              token: foundCase.id,
              name: foundCase.title,
              type: 'MASTER_CASE',
              location: foundCase.location,
              district: foundCase.district,
              details: foundCase.summary
            });
            setStatus(foundCase.status || 'RECEIVED');
            setPublicSummary(foundCase.summary || '');
            setLinkedTickets(tickets.filter(t => t.assignedCaseId === id));
          }
        }
      };

      const loadRecord = (id) => {
        if (db) {
          const coll = id.startsWith('AWC-LEG-') ? 'legalRequests' : (id.startsWith('CASE-') ? 'cases' : 'complaints');
          db.collection(coll).doc(id).get().then(doc => {
            if (doc.exists) {
              const data = doc.data();
              if (coll === 'cases') {
                setTicket({
                  token: doc.id,
                  name: data.title,
                  type: 'MASTER_CASE',
                  location: data.location,
                  district: data.district,
                  details: data.summary
                });
                setStatus(data.status || 'RECEIVED');
                setPublicSummary(data.summary || '');
                const tickets = JSON.parse(localStorage.getItem('awc_tickets') || '[]');
                setLinkedTickets(tickets.filter(t => t.assignedCaseId === id));
              } else {
                populateTicketFields({ ...data, token: doc.id });
              }
            } else {
              fallbackLoad(id);
            }
          }).catch(err => {
            console.warn("Firestore fetch error:", err);
            fallbackLoad(id);
          });
        } else {
          fallbackLoad(id);
        }
      };

      // Handle Save & Cross-Window Dispatch
      const handleSave = async () => {
        setIsSaving(true);
        try {
          const isMasterCase = recordId.startsWith('CASE-');
          const targetCase = availableCases.find(c => c.id === assignedCaseId);

          const updateData = {
            status,
            policeStation,
            cibNumber,
            bReportNo,
            assignedLawyer,
            internalNotes,
            selectedStatutes,
            publishToPublic,
            publicSummary,
            assignedCaseId: isMasterCase ? null : (assignedCaseId || null),
            caseTitle: targetCase ? targetCase.title : null,
            updatedAt: new Date().toISOString()
          };

          // Save locally
          const tickets = JSON.parse(localStorage.getItem('awc_tickets') || '[]');
          const idx = tickets.findIndex(t => t.token === recordId);
          if (idx !== -1) {
            tickets[idx] = { ...tickets[idx], ...updateData };
            localStorage.setItem('awc_tickets', JSON.stringify(tickets));
          } else if (isMasterCase) {
            const cases = JSON.parse(localStorage.getItem('awc_cases') || '[]');
            const cIdx = cases.findIndex(c => c.id === recordId);
            if (cIdx !== -1) {
              cases[cIdx] = {
                ...cases[cIdx],
                status,
                summary: publicSummary || cases[cIdx].summary,
                updatedAt: new Date().toISOString()
              };
              localStorage.setItem('awc_cases', JSON.stringify(cases));
            }

            // If milestone or summary updated on Master Case, broadcast to linked tickets
            if (publicSummary) {
              const updatedTickets = tickets.map(t => {
                if (t.assignedCaseId === recordId) {
                  return {
                    ...t,
                    status,
                    latestMilestone: publicSummary,
                    milestoneDate: new Date().toISOString().split('T')[0]
                  };
                }
                return t;
              });
              localStorage.setItem('awc_tickets', JSON.stringify(updatedTickets));
            }
          }

          // Save to Firestore
          if (db) {
            const coll = recordId.startsWith('AWC-LEG-') ? 'legalRequests' : (isMasterCase ? 'cases' : 'complaints');
            await db.collection(coll).doc(recordId).set(updateData, { merge: true });

            if (!isMasterCase) {
              await db.collection('ticketStatus').doc(recordId).set({
                status,
                assignedCaseId: assignedCaseId || null,
                caseTitle: targetCase ? targetCase.title : null,
                lastUpdated: new Date().toISOString(),
                ...(publishToPublic ? { publicSummary } : {})
              }, { merge: true });
            } else if (publicSummary) {
              // Broadcast to all linked tickets in Firestore
              const linked = tickets.filter(t => t.assignedCaseId === recordId);
              for (const lt of linked) {
                try {
                  await db.collection('ticketStatus').doc(lt.token).set({
                    status,
                    latestMilestone: publicSummary,
                    milestoneDate: new Date().toISOString().split('T')[0]
                  }, { merge: true });
                } catch (e) {
                  console.warn("Cascade status write:", e);
                }
              }
            }
          }

          setIsDirty(false);

          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: 'RECORD_SAVED',
              id: recordId,
              status
            }, '*');
          }

          setSaveToast('Record saved & synced to Firestore and Parent Console!');
          setTimeout(() => setSaveToast(null), 3500);
        } catch (err) {
          console.warn("Save note:", err);
          setSaveToast('Saved locally (' + (err.message || 'offline') + ')');
          setTimeout(() => setSaveToast(null), 3500);
          setIsDirty(false);
        } finally {
          setIsSaving(false);
        }
      };

      const toggleStatute = (key) => {
        setIsDirty(true);
        if (selectedStatutes.includes(key)) {
          setSelectedStatutes(selectedStatutes.filter(s => s !== key));
        } else {
          setSelectedStatutes([...selectedStatutes, key]);
        }
      };

      // Admin Login Handler
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');

        if (loginEmail.trim().toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
          setLoginError(`Unauthorized. Access strictly restricted to ${ADMIN_EMAIL}.`);
          return;
        }

        if (typeof firebase !== 'undefined' && firebase.auth && loginPassword) {
          try {
            await firebase.auth().signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
            setIsAuthenticated(true);
            sessionStorage.setItem('awc_admin_auth', 'true');
            sessionStorage.setItem('awc_admin_email', ADMIN_EMAIL);
            return;
          } catch (err) {
            console.warn("Auth sign-in notice:", err);
            if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
              setLoginError('Authentication failed: ' + err.message);
              return;
            }
          }
        }

        setIsAuthenticated(true);
        sessionStorage.setItem('awc_admin_auth', 'true');
        sessionStorage.setItem('awc_admin_email', ADMIN_EMAIL);
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        sessionStorage.removeItem('awc_admin_auth');
        sessionStorage.removeItem('awc_admin_email');
        if (typeof firebase !== 'undefined' && firebase.auth) {
          firebase.auth().signOut().catch(() => {});
        }
      };

      // Strict Login Gate
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
              <div className="text-center mb-8">
                <img src="assets/logo.png" alt="AWC Logo" className="h-14 w-auto mx-auto mb-4 object-contain" onError={e=>e.target.style.display='none'} />
                <h1 className="text-xl font-black text-white">Master Case Editor</h1>
                <p className="text-xs text-slate-400 mt-1">Authorized Legal Counsel & Admin Access Only</p>
              </div>

              {loginError && (
                <div className="mb-6 p-4 rounded-xl bg-red-950/60 border border-red-800 text-red-300 text-xs">
                  {loginError}
                </div>
              )}

              <form onSubmit={handleLogin} className="space-y-4 text-xs">
                <div>
                  <label className="block font-bold text-slate-300 mb-1">Designated Admin Email</label>
                  <input
                    type="email"
                    required
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white font-mono"
                  />
                </div>

                <div>
                  <label className="block font-bold text-slate-300 mb-1">Password</label>
                  <input
                    type="password"
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    placeholder="Enter admin password"
                    className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg transition text-sm"
                >
                  Authenticate & Open Editor
                </button>
              </form>

              <div className="mt-6 text-center text-xs text-slate-500 space-x-3">
                <a href="admin.html" className="text-emerald-400 hover:underline">← Admin Console</a>
                <span>•</span>
                <a href="index.html" className="text-slate-400 hover:underline">Public Portal</a>
              </div>
            </div>
          </div>
        );
      }

      if (!ticket) {
        return (
          <div className="p-8 text-center text-slate-500">
            Loading record or invalid ticket ID ({recordId})...
          </div>
        );
      }

      const currentIndex = STAGES.findIndex(s => s.key === status);
      const isMasterCase = recordId.startsWith('CASE-');

      return (
        <div className="max-w-5xl mx-auto p-6 space-y-6">
          
          {/* Top Bar */}
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg">
            <div>
              <div className="flex items-center space-x-3">
                <span className="font-mono text-xs font-bold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
                  {ticket.token}
                </span>
                <span className="text-xs text-slate-400">
                  {ticket.type} ({ticket.district || 'National'})
                </span>
                {isDirty && (
                  <span className="text-[10px] font-bold text-amber-400 bg-amber-950 px-2 py-0.5 rounded animate-pulse">
                    Unsaved Edits
                  </span>
                )}
              </div>
              <h2 className="text-lg font-black text-white mt-1">{ticket.name || 'Anonymous Complainant'}</h2>
            </div>

            <div className="flex items-center space-x-3">
              {saveToast && (
                <span className="text-xs font-bold text-emerald-400 bg-emerald-950 px-3 py-1.5 rounded-lg border border-emerald-800">
                  ✓ {saveToast}
                </span>
              )}
              <a
                href="admin.html"
                className="px-3.5 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
              >
                ← Back to Console
              </a>
              <button
                onClick={handleLogout}
                className="px-3 py-2.5 rounded-xl text-xs font-bold text-red-400 bg-red-950/40 hover:bg-red-900/40 border border-red-800 transition"
              >
                Sign Out
              </button>
              <button
                onClick={handleSave}
                disabled={isSaving}
                className="px-6 py-2.5 rounded-xl font-bold bg-emerald-600 hover:bg-emerald-500 text-white text-xs shadow-md shadow-emerald-900/40 transition flex items-center space-x-1.5"
              >
                <span>{isSaving ? 'Saving...' : 'Save & Sync'}</span>
              </button>
            </div>
          </div>

          {/* Stepper */}
          <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-md">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-4">
              Case Lifecycle Progress Stepper
            </span>

            <div className="flex items-center justify-between relative py-2">
              <div className="absolute top-1/2 left-0 right-0 h-1 bg-slate-800 -translate-y-1/2 -z-0"></div>
              <div
                className="absolute top-1/2 left-0 h-1 bg-emerald-500 -translate-y-1/2 transition-all duration-300"
                style={{ width: `${(Math.max(0, currentIndex) / (STAGES.length - 1)) * 100}%` }}
              ></div>

              {STAGES.map((st, idx) => {
                const isDone = idx <= currentIndex;
                const isCurrent = idx === currentIndex;
                return (
                  <button
                    key={st.key}
                    type="button"
                    onClick={() => { setStatus(st.key); setIsDirty(true); }}
                    className="relative z-10 flex flex-col items-center group cursor-pointer"
                  >
                    <div className={`w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold transition-all ${
                      isCurrent ? 'bg-emerald-500 text-white ring-4 ring-emerald-950 shadow-lg' :
                      isDone ? 'bg-emerald-700 text-white' : 'bg-slate-800 text-slate-400 border border-slate-700'
                    }`}>
                      {isDone ? '✓' : idx + 1}
                    </div>
                    <span className={`text-[11px] font-bold mt-2 ${isCurrent ? 'text-emerald-400' : 'text-slate-400'}`}>
                      {st.label}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Two-Column Editor Layout */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
            
            {/* Left Column */}
            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
              <h3 className="text-sm font-bold text-white uppercase tracking-wider border-b border-slate-800 pb-2">
                {isMasterCase ? 'Master Case Information' : 'Original Intake Dossier'}
              </h3>

              {!isMasterCase ? (
                <>
                  <div>
                    <strong className="text-slate-400 block">Complainant Name & Contact:</strong>
                    <div className="font-semibold text-white mt-0.5">{ticket.name || 'Anonymous'}</div>
                    <div className="text-slate-300">{ticket.phone} | {ticket.email}</div>
                  </div>

                  <div>
                    <strong className="text-slate-400 block">Incident Location:</strong>
                    <div className="text-slate-300 mt-0.5">{ticket.location || 'N/A'}, {ticket.district}</div>
                  </div>

                  {/* MASTER CASE ASSIGNMENT DROPDOWN */}
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-1.5">
                    <label className="block text-slate-300 font-bold">
                      Assigned Master Case:
                    </label>
                    <select
                      value={assignedCaseId}
                      onChange={(e) => {
                        setAssignedCaseId(e.target.value);
                        setIsDirty(true);
                      }}
                      className="w-full px-3 py-2 rounded-xl border border-slate-700 bg-slate-900 text-white font-medium outline-none focus:ring-1 focus:ring-emerald-500"
                    >
                      <option value="">-- Unassigned (Individual Ticket) --</option>
                      {availableCases.map(c => (
                        <option key={c.id} value={c.id}>
                          {c.id}: {c.title}
                        </option>
                      ))}
                    </select>
                    <span className="text-[10px] text-slate-500 block">
                      Assigning bundles this complaint under an umbrella legal case. Updates to the Master Case stream to this ticket.
                    </span>
                  </div>

                  <div>
                    <strong className="text-slate-400 block">Incident Narrative:</strong>
                    <p className="p-3 rounded-xl bg-slate-950 text-slate-300 leading-relaxed mt-1 border border-slate-800 font-mono">
                      {ticket.details}
                    </p>
                  </div>
                </>
              ) : (
                <>
                  <div>
                    <strong className="text-slate-400 block">Case Title & Jurisdiction:</strong>
                    <div className="font-semibold text-white text-base mt-0.5">{ticket.name}</div>
                    <div className="text-slate-300">{ticket.location} ({ticket.district})</div>
                  </div>

                  {/* LINKED COMPLAINTS IN MASTER CASE */}
                  <div className="p-4 rounded-xl bg-blue-950/40 border border-blue-900/60 space-y-2">
                    <div className="font-bold text-blue-200 text-xs flex justify-between">
                      <span>Linked Complaint Tickets ({linkedTickets.length})</span>
                      <span className="text-[10px] text-blue-300">All receive case updates</span>
                    </div>
                    <div className="space-y-1.5">
                      {linkedTickets.map(lt => (
                        <div key={lt.token} className="p-2 rounded-lg bg-slate-900/80 border border-slate-800 flex justify-between items-center text-[11px]">
                          <div>
                            <span className="font-mono font-bold text-emerald-400 mr-2">{lt.token}</span>
                            <span className="text-white">{lt.name || 'Anonymous'}</span>
                          </div>
                          <span className="text-slate-400">{lt.phone}</span>
                        </div>
                      ))}
                      {linkedTickets.length === 0 && (
                        <div className="text-[11px] text-slate-400 italic">No complaint tickets linked yet.</div>
                      )}
                    </div>
                  </div>
                </>
              )}

              {/* Statutory Tagging Tool */}
              <div className="pt-2">
                <strong className="text-slate-400 block mb-2">Tag Applicable Legal Statutes:</strong>
                <div className="grid grid-cols-1 gap-2 text-[11px]">
                  {[
                    { key: '1907_SEC_2', label: '1907 Ord Sec 2 (Cruelty / Beating / Transport)' },
                    { key: '1907_SEC_4', label: '1907 Ord Sec 4 (Cruel Killing)' },
                    { key: 'PENAL_411', label: 'Penal Code 411 / 412 (Mischief to Animal)' },
                    { key: 'ANIMALS_ACT_1958', label: 'Animals Act 1958 / Gazette 1629/17 (Transport / Cattle Vouchers)' },
                    { key: 'BUTCHERS_2008', label: 'Butchers Ord 1893 (Ban on Pregnant Cow Slaughter)' },
                    { key: 'DANGEROUS_ANIMALS_2022', label: 'Dangerous Animals Act No. 40 of 2022 (Rs. 250k Fine)' },
                    { key: 'FFPO_SEC_22A', label: 'FFPO Sec 22A (Captive Elephant Custody)' }
                  ].map(stat => (
                    <label key={stat.key} className="flex items-center space-x-2 p-2 rounded-lg bg-slate-950 border border-slate-800 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={selectedStatutes.includes(stat.key)}
                        onChange={() => toggleStatute(stat.key)}
                        className="rounded text-emerald-600 focus:ring-emerald-500"
                      />
                      <span className="text-slate-300">{stat.label}</span>
                    </label>
                  ))}
                </div>
              </div>
            </div>

            {/* Right Column */}
            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
              <h3 className="text-sm font-bold text-white uppercase tracking-wider border-b border-slate-800 pb-2">
                Legal Actions & Police Tracking
              </h3>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 font-bold mb-1">Police Station</label>
                  <input
                    type="text"
                    value={policeStation}
                    onChange={e => { setPoliceStation(e.target.value); setIsDirty(true); }}
                    placeholder="e.g. Maharagama Police"
                    className="w-full px-3 py-2 rounded-xl border border-slate-700 bg-slate-950 text-white"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 font-bold mb-1">Police CIB / IB #</label>
                  <input
                    type="text"
                    value={cibNumber}
                    onChange={e => { setCibNumber(e.target.value); setIsDirty(true); }}
                    placeholder="e.g. CIB 112/2026"
                    className="w-full px-3 py-2 rounded-xl border border-slate-700 bg-slate-950 text-white font-mono"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 font-bold mb-1">Court B-Report #</label>
                  <input
                    type="text"
                    value={bReportNo}
                    onChange={e => { setBReportNo(e.target.value); setIsDirty(true); }}
                    placeholder="e.g. B/456/2026"
                    className="w-full px-3 py-2 rounded-xl border border-slate-700 bg-slate-950 text-white font-mono"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 font-bold mb-1">Assigned Legal Counsel</label>
                  <input
                    type="text"
                    value={assignedLawyer}
                    onChange={e => { setAssignedLawyer(e.target.value); setIsDirty(true); }}
                    placeholder="e.g. Attorney Sajeewa Gamage"
                    className="w-full px-3 py-2 rounded-xl border border-slate-700 bg-slate-950 text-white"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-400 font-bold mb-1">Confidential Internal Legal Notes</label>
                <textarea
                  rows="4"
                  value={internalNotes}
                  onChange={e => { setInternalNotes(e.target.value); setIsDirty(true); }}
                  placeholder="Record confidential witness safety notes, hearing dates, GVS post-mortem results..."
                  className="w-full px-3 py-2 rounded-xl border border-slate-700 bg-slate-950 text-white font-mono"
                ></textarea>
              </div>

              {/* Public Timeline Projection Section */}
              <div className="pt-3 border-t border-slate-800 space-y-3">
                <label className="flex items-center space-x-2 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={publishToPublic}
                    onChange={e => { setPublishToPublic(e.target.checked); setIsDirty(true); }}
                    className="rounded text-emerald-600 focus:ring-emerald-500"
                  />
                  <span className="font-bold text-white">
                    {isMasterCase ? 'Publish Milestone & Broadcast to All Linked Complaints' : 'Publish Sanitized Timeline to Public Website & Tracker'}
                  </span>
                </label>

                {publishToPublic && (
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">
                      {isMasterCase ? 'Case Milestone Update (Broadcasts to all linked tickets)' : 'Sanitized Public Milestone Summary (No witness names)'}
                    </label>
                    <textarea
                      rows="3"
                      value={publicSummary}
                      onChange={e => { setPublicSummary(e.target.value); setIsDirty(true); }}
                      placeholder="e.g. B-Report submitted to Magistrate Court. Counsel Sajeewa Gamage appeared. Next hearing on Dec 15."
                      className="w-full px-3 py-2 rounded-xl border border-slate-700 bg-slate-950 text-emerald-300"
                    ></textarea>
                  </div>
                )}
              </div>

            </div>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EditorApp />);
  </script>
</body>
</html>
