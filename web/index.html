        e.preventDefault();
        const token = 'AWC-LEG-' + Math.floor(100000 + Math.random() * 900000);
        const newTicket = {
          token,
          type: 'LEGAL_ASSISTANCE',
          name,
          phone,
          email,
          caseNo,
          details: legalIssue,
          createdAt: new Date().toISOString(),
          status: 'RECEIVED',
          notes: []
        };
        const existing = JSON.parse(localStorage.getItem('awc_tickets') || '[]');
        existing.unshift(newTicket);
        localStorage.setItem('awc_tickets', JSON.stringify(existing));

        if (db) {
          try {
            db.collection('legalRequests').doc(token).set(newTicket).catch(e => console.warn("Firestore error:", e));
            db.collection('ticketStatus').doc(token).set({
              token,
              type: 'LEGAL_ASSISTANCE',
              status: 'RECEIVED',
              createdAt: new Date().toISOString()
            }).catch(e => console.warn("Firestore error:", e));

            console.warn("Firestore sync:", e);
          }

    function TrackTicketModal({ lang, onClose }) {
      const [token, setToken] = useState('');
      const [result, setResult] = useState(null);
      const [notFound, setNotFound] = useState(false);

      const handleSearch = (e) => {
        e.preventDefault();
        const cleanToken = token.trim().toUpperCase();

        if (db) {
          db.collection('ticketStatus').doc(cleanToken).get().then(doc => {
            if (doc.exists) {
              setResult(doc.data());
              setNotFound(false);
            } else {
              fallbackSearch(cleanToken);
            }
          }).catch(() => fallbackSearch(cleanToken));
        } else {
          fallbackSearch(cleanToken);
        }
      };

      const fallbackSearch = (cleanToken) => {
        const existing = JSON.parse(localStorage.getItem('awc_tickets') || '[]');
        const found = existing.find(t => t.token.trim().toUpperCase() === cleanToken);
        if (found) {
          setResult(found);
          setNotFound(false);
        } else {
          setResult(null);
          setNotFound(true);
        }
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-2xl relative my-8">

                <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-2">
